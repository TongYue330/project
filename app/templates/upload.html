{% extends "base.html" %}
{% block content %}
<h2>上传题目</h2>
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
<form method="post" action="{{ url_for('main.upload') }}">
    <label>请输入题目文字：</label>
    <textarea name="text" rows="5" placeholder="例如：请解释快速排序的时间复杂度"></textarea>
    <label><input type="radio" name="mode" value="llm" checked> 千问模型 + RAG</label>
    <label><input type="radio" name="mode" value="mock"> 本地模拟模式</label>
    <label><input type="checkbox" name="use_rag" checked> 使用课程资料检索</label>
    <button type="submit">提交</button>
</form>
{% endblock %}
